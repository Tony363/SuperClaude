name: Update Architecture Map

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ARCHITECTURE.md'
      - '.github/workflows/update-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-architecture
  cancel-in-progress: true

jobs:
  update-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip bot commits to prevent infinite loops
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache GitNexus index
        uses: actions/cache@v4
        with:
          path: .gitnexus
          key: gitnexus-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: |
            gitnexus-${{ runner.os }}-main-
            gitnexus-${{ runner.os }}-

      - name: Index codebase
        run: npx gitnexus analyze

      - name: Generate architecture data
        id: archdata
        run: |
          # Query key architectural concepts
          ENTRY_POINTS=$(npx gitnexus query "entry points main CLI" --limit 10 2>/dev/null || echo '{"processes":[]}')
          CORE_MODULES=$(npx gitnexus query "core modules services" --limit 10 2>/dev/null || echo '{"processes":[]}')
          DATA_FLOW=$(npx gitnexus query "data flow pipeline" --limit 10 2>/dev/null || echo '{"processes":[]}')
          AGENTS=$(npx gitnexus query "agent orchestration" --limit 10 2>/dev/null || echo '{"processes":[]}')

          # Extract process summaries
          ENTRY_SUMMARY=$(echo "$ENTRY_POINTS" | jq -r '[.processes[]? | .summary] | join("\n")' 2>/dev/null || echo "none")
          CORE_SUMMARY=$(echo "$CORE_MODULES" | jq -r '[.processes[]? | .summary] | join("\n")' 2>/dev/null || echo "none")
          DATA_SUMMARY=$(echo "$DATA_FLOW" | jq -r '[.processes[]? | .summary] | join("\n")' 2>/dev/null || echo "none")
          AGENT_SUMMARY=$(echo "$AGENTS" | jq -r '[.processes[]? | .summary] | join("\n")' 2>/dev/null || echo "none")

          # Get file/symbol counts from status
          STATUS=$(npx gitnexus status 2>/dev/null || echo "unknown")

          # Count files by extension
          PY_COUNT=$(find . -name '*.py' -not -path './.git/*' -not -path './.gitnexus/*' | wc -l)
          RS_COUNT=$(find . -name '*.rs' -not -path './.git/*' -not -path './.gitnexus/*' | wc -l)
          YML_COUNT=$(find . -name '*.yml' -path './.github/*' | wc -l)
          MD_COUNT=$(find . -name '*.md' -not -path './.git/*' -not -path './.gitnexus/*' | wc -l)

          # Save to env file for next step
          {
            echo "ENTRY_SUMMARY<<ARCHEOF"
            echo "$ENTRY_SUMMARY"
            echo "ARCHEOF"
            echo "CORE_SUMMARY<<ARCHEOF"
            echo "$CORE_SUMMARY"
            echo "ARCHEOF"
            echo "DATA_SUMMARY<<ARCHEOF"
            echo "$DATA_SUMMARY"
            echo "ARCHEOF"
            echo "AGENT_SUMMARY<<ARCHEOF"
            echo "$AGENT_SUMMARY"
            echo "ARCHEOF"
            echo "PY_COUNT=$PY_COUNT"
            echo "RS_COUNT=$RS_COUNT"
            echo "YML_COUNT=$YML_COUNT"
            echo "MD_COUNT=$MD_COUNT"
            echo "INDEX_STATUS<<ARCHEOF"
            echo "$STATUS"
            echo "ARCHEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate ARCHITECTURE.md
        env:
          ENTRY_SUMMARY: ${{ steps.archdata.outputs.ENTRY_SUMMARY }}
          CORE_SUMMARY: ${{ steps.archdata.outputs.CORE_SUMMARY }}
          DATA_SUMMARY: ${{ steps.archdata.outputs.DATA_SUMMARY }}
          AGENT_SUMMARY: ${{ steps.archdata.outputs.AGENT_SUMMARY }}
          PY_COUNT: ${{ steps.archdata.outputs.PY_COUNT }}
          RS_COUNT: ${{ steps.archdata.outputs.RS_COUNT }}
          YML_COUNT: ${{ steps.archdata.outputs.YML_COUNT }}
          MD_COUNT: ${{ steps.archdata.outputs.MD_COUNT }}
        run: |
          cat > ARCHITECTURE.md << 'TEMPLATE_START'
          # SuperClaude Architecture

          > Auto-generated by GitNexus knowledge graph analysis.
          > Last updated: REPLACE_DATE

          ## Codebase Overview

          | Metric | Count |
          |--------|-------|
          TEMPLATE_START

          # Strip leading whitespace from heredoc
          sed -i 's/^          //' ARCHITECTURE.md

          # Append dynamic stats
          {
            echo "| Python files | ${PY_COUNT} |"
            echo "| Rust files | ${RS_COUNT} |"
            echo "| GitHub workflows | ${YML_COUNT} |"
            echo "| Documentation files | ${MD_COUNT} |"
            echo ""
            echo "## Entry Points"
            echo ""
            if [[ -n "$ENTRY_SUMMARY" && "$ENTRY_SUMMARY" != "none" ]]; then
              echo "$ENTRY_SUMMARY" | while IFS= read -r line; do
                [[ -n "$line" ]] && echo "- $line"
              done
            else
              echo "- No entry points detected"
            fi
            echo ""
            echo "## Core Modules"
            echo ""
            if [[ -n "$CORE_SUMMARY" && "$CORE_SUMMARY" != "none" ]]; then
              echo "$CORE_SUMMARY" | while IFS= read -r line; do
                [[ -n "$line" ]] && echo "- $line"
              done
            else
              echo "- No core modules detected"
            fi
            echo ""
            echo "## Data Flow"
            echo ""
            if [[ -n "$DATA_SUMMARY" && "$DATA_SUMMARY" != "none" ]]; then
              echo "$DATA_SUMMARY" | while IFS= read -r line; do
                [[ -n "$line" ]] && echo "- $line"
              done
            else
              echo "- No data flows detected"
            fi
            echo ""
            echo "## Agent Orchestration"
            echo ""
            if [[ -n "$AGENT_SUMMARY" && "$AGENT_SUMMARY" != "none" ]]; then
              echo "$AGENT_SUMMARY" | while IFS= read -r line; do
                [[ -n "$line" ]] && echo "- $line"
              done
            else
              echo "- No agent orchestration detected"
            fi
            echo ""
            echo "---"
            echo "*Generated by [GitNexus](https://github.com/nicholasgriffintn/gitnexus) code intelligence*"
          } >> ARCHITECTURE.md

          # Replace date placeholder
          sed -i "s/REPLACE_DATE/$(date -u '+%Y-%m-%d %H:%M UTC')/" ARCHITECTURE.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet ARCHITECTURE.md 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to ARCHITECTURE.md"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ARCHITECTURE.md has been updated"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update ARCHITECTURE.md [skip ci]'
          title: 'docs: update ARCHITECTURE.md'
          body: |
            ## Auto-generated Architecture Update

            The GitNexus knowledge graph detected structural changes in `main` and regenerated `ARCHITECTURE.md`.

            This PR was created automatically by the `update-architecture` workflow.
          branch: auto/update-architecture
          labels: documentation,automated
          delete-branch: true
