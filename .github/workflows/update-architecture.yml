name: Update Architecture Map

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - '.github/workflows/update-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip bot commits to prevent infinite loops
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '20'

      - name: Cache GitNexus index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .gitnexus
          key: gitnexus-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: |
            gitnexus-${{ runner.os }}-main-
            gitnexus-${{ runner.os }}-

      - name: Index codebase
        run: npx gitnexus analyze

      - name: Generate ARCHITECTURE.md
        run: bash .github/scripts/generate-architecture.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet ARCHITECTURE.md AGENTS.md 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Architecture docs have been updated"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: update ARCHITECTURE.md [skip ci]'
          title: 'docs: update ARCHITECTURE.md'
          body: |
            ## Auto-generated Architecture Update

            The GitNexus knowledge graph detected structural changes in `main` and regenerated `ARCHITECTURE.md`.

            This PR was created automatically by the `update-architecture` workflow.
          branch: auto/update-architecture
          labels: documentation,automated
          delete-branch: true
