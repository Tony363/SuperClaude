# SuperClaude Framework Main Configuration
# Version 7.0.0
#
# Read by: crates/superclaude-core/src/config.rs
# Parsed into: SuperClaudeConfig (types.rs) — version, name, modes, quality

version: 7.0.0
name: SuperClaude Framework

# Framework modes (consumed by inventory.rs for mode discovery)
modes:
  default: normal
  available:
    - normal
    - brainstorming
    - introspection
    - task_management
    - token_efficiency
    - orchestration

# Agent system configuration
agents:
  max_delegation_depth: 5
  circular_detection: true
  parallel_execution: true
  default_timeout: 300
  # Agent discovery is filesystem-based (agents/core/, agents/traits/, agents/extensions/)

# Quality scoring configuration (consumed by QualityConfig struct)
quality:
  enabled: true
  default_threshold: 70.0
  max_iterations: 5

  # Quality dimensions and weights (9 dimensions, must sum to 1.0)
  dimensions:
    correctness: 0.25
    completeness: 0.20
    performance: 0.10
    maintainability: 0.10
    security: 0.10
    scalability: 0.10
    testability: 0.10
    pal_review: 0.00       # Dynamic — external review via mcp__pal__codereview
    usability: 0.05

# Worktree management
worktree:
  enabled: true
  base_dir: .worktrees
  max_worktrees: 10
  cleanup_age_days: 7
  integration_branch: integration

# MCP server configuration
mcp_servers:
  enabled: true
  timeout: 300
  retry_attempts: 3
  servers:
    pal:
      enabled: true
      models:
        - gpt-5
        - claude-opus-4.1
        - gemini-2.5-pro
